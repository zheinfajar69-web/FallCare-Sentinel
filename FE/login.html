<!DOCTYPE html>
<html lang="id" class="">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masuk — ByteCraft</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        fontFamily: {
          ui: ['"Inter"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          mono: ['"IBM Plex Mono"', 'ui-monospace', 'SFMono-Regular', 'monospace'],
        },
        colors: {
          paper:   { DEFAULT: '#EDE6D6', soft: '#F5F0E4', deep: '#E1D8C2', card: '#F7F2EB' },
          ink:     { DEFAULT: '#2B281F', soft: '#4A4636', faint: '#7A7460' },
          moss:    { DEFAULT: '#3F4B3B', deep: '#2E3A2A', bright: '#5C7052', sage: '#8BBB92' },
          rust:    { DEFAULT: '#9C4A2E', deep: '#7C3A22' },
          slate:   { 900: '#191A16', 850: '#1F211C', 800: '#262822', 700: '#33352C', 600: '#494B40' },
          bone:    { DEFAULT: '#D8CDA8' },
          pine:    { DEFAULT: '#092328' },
        },
        borderRadius: { none: '0px' }
      }
    }
  }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  html { color-scheme: light; }
  html.dark { color-scheme: dark; }
  ::selection { background: #9C4A2E; color: #F5F0E4; }

  .focus-ring:focus-visible {
    outline: 2px solid #9C4A2E; outline-offset: 2px;
  }

  input.field-input:focus-visible {
    outline: none;
    border-color: #3F4B3B;
    box-shadow: 0 0 0 1px #3F4B3B;
  }
  .dark input.field-input:focus-visible {
    border-color: #8BBB92;
    box-shadow: 0 0 0 1px #8BBB92;
  }

  @keyframes pulse-rec {
    0%, 100% { opacity: 1; } 50% { opacity: .35; }
  }
  .status-live { animation: pulse-rec 2.2s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) {
    .status-live { animation: none; }
    * { transition-duration: 0.01ms !important; }
  }

  /* Guratan halus di header, senada dengan penanda rangka/target di camera.html —
     bukan dekorasi acak, melainkan motif korelasi visual antar halaman. */
  .grid-motif {
    background-image:
      linear-gradient(to right, rgba(245,240,228,0.06) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(245,240,228,0.06) 1px, transparent 1px);
    background-size: 28px 28px;
  }
</style>
</head>

<body class="bg-paper dark:bg-slate-900 text-ink dark:text-bone font-ui antialiased min-h-screen">

<div class="min-h-screen flex flex-col">

  <!-- Toggle tema, konsisten posisinya dengan halaman lain -->
  <div class="flex justify-end px-4 md:px-8 pt-4">
    <button id="themeToggle" class="flex items-center gap-2 px-3 py-2 border border-ink/15 dark:border-bone/15 text-ink/60 dark:text-bone/50 hover:text-ink dark:hover:text-bone hover:bg-ink/[0.04] dark:hover:bg-bone/5 focus-ring text-[12px]">
      <svg id="iconMoon" class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
      <svg id="iconSun" class="w-4 h-4 shrink-0 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <span class="font-mono">Mode gelap</span>
    </button>
  </div>

  <main class="flex-1 flex items-center justify-center px-4 py-8">
    <div class="w-full max-w-[400px]">

      <!-- ===== Header: Log In + ByteCraft ===== -->
      <div class="grid-motif relative bg-pine px-7 py-7 flex flex-col justify-center">
        <h1 class="text-white text-[30px] leading-[1.15] font-medium">Log In</h1>
        <p class="text-bone/70 text-[13px] mt-1 tracking-wide">ByteCraft</p>
      </div>

      <!-- ===== Card form ===== -->
      <div class="bg-paper-card dark:bg-slate-850 border border-moss-sage dark:border-moss-bright/40 px-6 py-7">
        <form id="loginForm" class="flex flex-col" novalidate>

          <label for="userInput" class="text-[13px] font-medium mb-1.5">User</label>
          <input
            id="userInput"
            name="username"
            type="text"
            autocomplete="username"
            placeholder="Nama pengguna"
            class="field-input w-full h-[42px] px-3.5 border border-moss-sage dark:border-bone/20 bg-transparent text-[14px] placeholder:text-ink/35 dark:placeholder:text-bone/30 rounded-md"
          />
          <p id="userError" class="hidden text-[11px] text-rust mt-1 font-mono">Nama pengguna wajib diisi.</p>

          <label for="passInput" class="text-[13px] font-medium mb-1.5 mt-4">Password</label>
          <div class="relative">
            <input
              id="passInput"
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder="Kata sandi"
              class="field-input w-full h-[42px] px-3.5 pr-10 border border-moss-sage dark:border-bone/20 bg-transparent text-[14px] placeholder:text-ink/35 dark:placeholder:text-bone/30 rounded-md"
            />
            <button type="button" id="togglePass" aria-label="Tampilkan kata sandi" class="absolute right-0 top-0 h-[42px] w-10 flex items-center justify-center text-ink/40 dark:text-bone/40 hover:text-ink dark:hover:text-bone focus-ring">
              <svg id="eyeOpen" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg id="eyeClosed" class="w-4 h-4 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a20.6 20.6 0 0 1 4.22-5.06M9.9 4.24A10.6 10.6 0 0 1 12 4c7 0 11 7 11 7a20.6 20.6 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>
            </button>
          </div>
          <p id="passError" class="hidden text-[11px] text-rust mt-1 font-mono">Kata sandi wajib diisi.</p>

          <p id="loginFormError" class="hidden text-[12px] text-rust mt-3 px-3 py-2 border border-rust/30 bg-rust/[0.06]">Nama pengguna atau kata sandi salah.</p>

          <button
            type="submit"
            id="submitBtn"
            class="mt-6 h-[46px] w-full flex items-center justify-center gap-2 px-6 bg-rust border-2 border-pine text-pine text-[14px] font-medium rounded-full hover:bg-rust-deep transition-colors focus-ring disabled:opacity-60 disabled:cursor-not-allowed"
          >
            <span id="submitLabel">Submit</span>
            <svg id="submitSpinner" class="hidden w-4 h-4 animate-spin" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2.5" stroke-opacity="0.3"/><path d="M21 12a9 9 0 0 0-9-9" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
          </button>

        </form>
      </div>
    </div>
  </main>
</div>

<script>
/* ---------- Tema (konsisten dengan camera.html) ---------- */
const root = document.documentElement;
function applyTheme(dark){
  root.classList.toggle('dark', dark);
  localStorage.setItem('sentra_theme', dark ? 'dark' : 'light');
  document.getElementById('iconMoon').classList.toggle('hidden', dark);
  document.getElementById('iconSun').classList.toggle('hidden', !dark);
}
applyTheme(localStorage.getItem('sentra_theme') === 'dark');
document.getElementById('themeToggle').addEventListener('click', () => applyTheme(!root.classList.contains('dark')));

/* ---------- Tampilkan/sembunyikan kata sandi ---------- */
const passInput = document.getElementById('passInput');
const togglePass = document.getElementById('togglePass');
const eyeOpen = document.getElementById('eyeOpen');
const eyeClosed = document.getElementById('eyeClosed');
togglePass.addEventListener('click', () => {
  const show = passInput.type === 'password';
  passInput.type = show ? 'text' : 'password';
  eyeOpen.classList.toggle('hidden', show);
  eyeClosed.classList.toggle('hidden', !show);
  togglePass.setAttribute('aria-label', show ? 'Sembunyikan kata sandi' : 'Tampilkan kata sandi');
});

/* ---------- Validasi & submit ----------
   Autentikasi sesungguhnya diverifikasi terhadap tabel `users` di SQLite lokal
   melalui endpoint backend (mis. POST /api/auth/login), yang membandingkan
   hash kata sandi (bukan teks polos) dan mengembalikan token sesi.
   Baris fetch() di bawah adalah titik integrasinya. */
const form = document.getElementById('loginForm');
const userInput = document.getElementById('userInput');
const userError = document.getElementById('userError');
const passError = document.getElementById('passError');
const loginFormError = document.getElementById('loginFormError');
const submitBtn = document.getElementById('submitBtn');
const submitLabel = document.getElementById('submitLabel');
const submitSpinner = document.getElementById('submitSpinner');

function setFieldError(input, errorEl, show){
  errorEl.classList.toggle('hidden', !show);
  input.classList.toggle('border-rust', show);
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  loginFormError.classList.add('hidden');

  const username = userInput.value.trim();
  const password = passInput.value;
  let hasError = false;

  setFieldError(userInput, userError, username.length === 0);
  if(username.length === 0) hasError = true;

  setFieldError(passInput, passError, password.length === 0);
  if(password.length === 0) hasError = true;

  if(hasError) return;

  submitBtn.disabled = true;
  submitLabel.textContent = 'Memeriksa…';
  submitSpinner.classList.remove('hidden');

  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });

    if(!res.ok){
      loginFormError.textContent = res.status === 401
        ? 'Nama pengguna atau kata sandi salah.'
        : 'Terjadi kendala saat masuk. Coba lagi.';
      loginFormError.classList.remove('hidden');
      return;
    }

    window.location.href = '/';
  } catch (err) {
    loginFormError.textContent = 'Tidak dapat menghubungi server lokal. Periksa koneksi perangkat.';
    loginFormError.classList.remove('hidden');
  } finally {
    submitBtn.disabled = false;
    submitLabel.textContent = 'Submit';
    submitSpinner.classList.add('hidden');
  }
});

/* Hilangkan pesan error begitu pengguna mulai mengoreksi input */
userInput.addEventListener('input', () => setFieldError(userInput, userError, false));
passInput.addEventListener('input', () => setFieldError(passInput, passError, false));
</script>

</body>
</html>
