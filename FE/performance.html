<script>
/* ---------- Tema (Selaras dengan Kamera) ---------- */
const root = document.documentElement;
function applyTheme(dark){
  root.classList.toggle('dark', dark);
  localStorage.setItem('sentra_theme', dark ? 'dark' : 'light');
  document.getElementById('iconMoon').classList.toggle('hidden', dark);
  document.getElementById('iconSun').classList.toggle('hidden', !dark);

  if(window.updateChartColors) window.updateChartColors(dark);
}
applyTheme(localStorage.getItem('sentra_theme') === 'dark');
document.getElementById('themeToggle').addEventListener('click', () => applyTheme(!root.classList.contains('dark')));
document.getElementById('themeToggleMobile').addEventListener('click', () => applyTheme(!root.classList.contains('dark')));

/* ---------- Sidebar & Mobile Menu ---------- */
const sidebar = document.getElementById('sidebar');
sidebar.addEventListener('dblclick', () => sidebar.classList.toggle('pinned-open'));

const hamburgerBtn = document.getElementById('hamburgerBtn');
const mobileMenuOverlay = document.getElementById('mobileMenuOverlay');
const mobileOverlayBg = document.getElementById('mobileOverlayBg');
function openMobileMenu(){ mobileMenuOverlay.classList.remove('hidden'); hamburgerBtn.setAttribute('aria-expanded','true'); }
function closeMobileMenu(){ mobileMenuOverlay.classList.add('hidden'); hamburgerBtn.setAttribute('aria-expanded','false'); }
hamburgerBtn.addEventListener('click', openMobileMenu);
mobileOverlayBg.addEventListener('click', closeMobileMenu);

/* ---------- Jam ---------- */
function tickClock(){
  document.getElementById('clock').textContent = new Date().toLocaleTimeString('id-ID', { hour12:false });
}
tickClock(); setInterval(tickClock, 1000);

Chart.defaults.font.family = '"IBM Plex Mono", monospace';
Chart.defaults.font.size = 11;
Chart.defaults.plugins.tooltip.enabled = false;

const labels30s = Array.from({length: 30}, (_, i) => (30 - i) + 'd');

function createLineChart(canvasId, colorStr, yAxisMax = null, isUptime = false) {
  const ctx = document.getElementById(canvasId).getContext('2d');

  return new Chart(ctx, {
    type: 'line',
    data: {
      labels: labels30s,
      datasets: [{
        data: Array(30).fill(0),
        borderColor: colorStr,
        backgroundColor: colorStr + '20',
        borderWidth: 2,
        fill: true,
        pointRadius: 0,
        pointHoverRadius: 0,
        tension: 0.3
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: { duration: 250, easing: 'linear' },
      scales: {
        x: {
          display: true,
          grid: { color: 'rgba(122,116,96,0.1)', drawBorder: false },
          ticks: { maxTicksLimit: 6 }
        },
        y: {
          display: true,
          min: 0,
          max: yAxisMax,
          grid: { color: 'rgba(122,116,96,0.1)', drawBorder: false },
          ticks: {
            callback: function(value) {
              if(isUptime) return value === 100 ? 'UP' : 'DOWN';
              return value;
            }
          }
        }
      },
      plugins: { legend: { display: false } }
    }
  });
}

const charts = {
  cpu: createLineChart('chartCpu', '#5C7052', 100),
  ram: createLineChart('chartRam', '#9C4A2E', null),
  lat: createLineChart('chartLat', '#4A4636', null),
  up:  createLineChart('chartUptime', '#5C7052', 105, true)
};

window.updateChartColors = function(isDark) {
  const gridColor = isDark ? 'rgba(216,205,168,0.08)' : 'rgba(43,40,31,0.08)';
  const textColor = isDark ? 'rgba(216,205,168,0.5)' : 'rgba(43,40,31,0.5)';

  Object.values(charts).forEach(chart => {
    chart.options.scales.x.grid.color = gridColor;
    chart.options.scales.y.grid.color = gridColor;
    chart.options.scales.x.ticks.color = textColor;
    chart.options.scales.y.ticks.color = textColor;

    if(chart.canvas.id === 'chartLat') {
      chart.data.datasets[0].borderColor = isDark ? '#D8CDA8' : '#4A4636';
      chart.data.datasets[0].backgroundColor = isDark ? 'rgba(216,205,168,0.15)' : 'rgba(74,70,54,0.15)';
    }
    chart.update();
  });
};
window.updateChartColors(root.classList.contains('dark'));

/* =====================================================================
   KONEKSI BACKEND (WebSocket /ws/performance)
   Format JSON dari server:
   {
     "cpu": 45,
     "ram_mb": 1250,
     "latency_ms": 32,
     "uptime_sec": 86400
   }
===================================================================== */
let wsPerf = null;
let fallbackInterval = null;

function pushDataToChart(chart, newValue) {
  const dataArray = chart.data.datasets[0].data;
  dataArray.push(newValue);
  dataArray.shift();
  chart.update();
}

function formatUptime(totalSeconds) {
  const d = Math.floor(totalSeconds / (3600*24));
  const h = Math.floor(totalSeconds % (3600*24) / 3600);
  const m = Math.floor(totalSeconds % 3600 / 60);
  const s = Math.floor(totalSeconds % 60);

  let str = "";
  if (d > 0) str += `${d}h `;
  str += `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
  return str;
}

function updateMetricsUI(data) {
  document.getElementById('valCpu').textContent = `${data.cpu.toFixed(1)}%`;
  document.getElementById('valRam').textContent = `${Math.round(data.ram_mb)} MB`;
  document.getElementById('valLat').textContent = `${Math.round(data.latency_ms)} ms`;
  document.getElementById('valUptime').textContent = formatUptime(data.uptime_sec);

  pushDataToChart(charts.cpu, data.cpu);
  pushDataToChart(charts.ram, data.ram_mb);
  pushDataToChart(charts.lat, data.latency_ms);

  pushDataToChart(charts.up, 100);
}

function setConnectionUI(connected) {
  const dot = document.getElementById('connIndicator');
  const txt = document.getElementById('connText');
  const mobileDot = document.getElementById('mobileConnectionStatus');

  if(connected) {
    dot.className = 'w-2 h-2 rounded-full bg-moss-bright status-live';
    mobileDot.className = 'w-2 h-2 rounded-full bg-moss-bright status-live';
    txt.textContent = 'Terhubung ke server (memperbarui setiap detik)';
  } else {
    dot.className = 'w-2 h-2 rounded-full bg-rust';
    mobileDot.className = 'w-2 h-2 rounded-full bg-rust';
    txt.textContent = 'Menunggu koneksi dari server SQLite/Python... (Menjalankan mode simulasi)';
  }
}

function connectPerformanceSocket() {
  try {
    const url = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws/performance';
    wsPerf = new WebSocket(url);

    wsPerf.onopen = () => {
      setConnectionUI(true);
      if(fallbackInterval) { clearInterval(fallbackInterval); fallbackInterval = null; }
    };

    wsPerf.onmessage = (ev) => {
      try {
        const payload = JSON.parse(ev.data);
        updateMetricsUI(payload);
      } catch(e) {
        console.error("Format data performa tidak valid", e);
      }
    };

    wsPerf.onclose = () => {
      setConnectionUI(false);
      wsPerf = null;
      startSimulationFallback();
      setTimeout(connectPerformanceSocket, 5000);
    };

    wsPerf.onerror = () => {
      if(wsPerf) wsPerf.close();
    };

  } catch(e) {
    setConnectionUI(false);
    startSimulationFallback();
  }
}

let simUptime = 12450;
let simCpu = 25;
function startSimulationFallback() {
  if(fallbackInterval) return;
  setConnectionUI(false);

  fallbackInterval = setInterval(() => {
    simCpu = Math.max(5, Math.min(95, simCpu + (Math.random() * 10 - 5)));
    const simData = {
      cpu: simCpu,
      ram_mb: 1024 + (Math.random() * 50),
      latency_ms: 20 + (Math.random() * 15),
      uptime_sec: simUptime++
    };
    updateMetricsUI(simData);
  }, 1000);
}

connectPerformanceSocket();

</script>
